name: CI

# 兑现 docs/publishing.md 与 README badge 里承诺的四件事：
#   1. Python 矩阵 3.10 / 3.12 / 3.13
#   2. ruff check + ruff format --check（pyproject.toml 已配好）
#   3. pytest 全绿（离线，不碰真实凭据）
#   4. python tools/check_repo.py 仓库卫生检查（密钥 / 个人绝对路径 / 断链）
# 外加 Node 测试（可选插件的 11 项）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt 里已经 -r requirements.txt（pytest + ruff 也在这）
          python -m pip install -r requirements-dev.txt
          # 装一遍包装元数据，顺便验证 package-dir / entry point 没写坏
          python -m pip install -e .

      - name: Repository hygiene (no secrets, no personal paths, no broken links)
        run: python tools/check_repo.py

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Tests
        run: python -m pytest -q

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Optional plugin tests
        run: node --test plugin/test/index.test.mjs
